<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Limpiando caché...</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .container {
      text-align: center;
      padding: 2rem;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 1rem;
      backdrop-filter: blur(10px);
    }
    .spinner {
      width: 50px;
      height: 50px;
      margin: 2rem auto;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 { margin: 0 0 1rem 0; }
    p { margin: 0.5rem 0; opacity: 0.9; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔄 Limpiando caché</h1>
    <div class="spinner"></div>
    <p>Eliminando datos antiguos...</p>
    <p style="font-size: 0.875rem;">Serás redirigido automáticamente</p>
  </div>

  <script>
    (async function() {
      console.log('[CLEAR] Iniciando limpieza...');
      
      // 1. Desregistrar todos los service workers
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map(reg => reg.unregister()));
        console.log('[CLEAR] Service Workers eliminados');
      }
      
      // 2. Limpiar todas las cachés
      if ('caches' in window) {
        const cacheNames = await caches.keys();
        await Promise.all(cacheNames.map(name => caches.delete(name)));
        console.log('[CLEAR] Cachés eliminados');
      }
      
      // 3. Limpiar localStorage y sessionStorage
      try {
        localStorage.clear();
        sessionStorage.clear();
        console.log('[CLEAR] Storage limpiado');
      } catch (e) {
        console.error('[CLEAR] Error limpiando storage:', e);
      }
      
      // 4. Esperar y redirigir
      setTimeout(() => {
        window.location.href = '/';
      }, 2000);
    })();
  </script>
</body>
</html>
